name: AI-SRE Benchmark & Self-Healing CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install kubernetes pyyaml matplotlib

    - name: Create KinD Kubernetes Cluster
      uses: helm/kind-action@v1.8.0
      with:
        cluster_name: ai-sre-ci-cluster

    - name: Verify Cluster Ready
      run: |
        kubectl get nodes
        kubectl cluster-info

    - name: Run Multi-Fault Chaos Suite & Evaluation Harness
      run: |
        python chaos.py bad_probe
        sleep 5
        python evaluator.py
        
        python chaos.py bad_image
        sleep 5
        python evaluator.py

    - name: Verify Final Cluster Health
      run: |
        kubectl get pods -A
